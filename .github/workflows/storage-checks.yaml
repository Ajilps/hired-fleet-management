name: Local storage checks

on:
  pull_request:
    branches: [development, main]
    paths: ['backend/**', 'compose.yaml', '.env.example', 'scripts/check-local-storage.sh', '.github/workflows/storage-checks.yaml']
  push:
    branches: [development, main]
    paths: ['backend/**', 'compose.yaml', '.env.example', 'scripts/check-local-storage.sh', '.github/workflows/storage-checks.yaml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: hired_files_test
          POSTGRES_USER: hired_test
          POSTGRES_PASSWORD: synthetic-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U hired_test -d hired_files_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://hired_test:synthetic-test-only@127.0.0.1:5432/hired_files_test
      TEST_STORAGE_ENDPOINT: http://127.0.0.1:8333
      STORAGE_REGION: us-east-1
      STORAGE_BUCKET: hired-dev-private
      STORAGE_ACCESS_KEY_ID: hired-local-access
      STORAGE_SECRET_ACCESS_KEY: local-development-secret-change-me
      CLAMAV_HOST: 127.0.0.1
      CLAMAV_PORT: '3310'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate development and application profiles
        run: |
          docker compose --env-file .env.example --profile dev config --quiet
          docker compose --env-file .env.example --profile apps config --quiet
          if SEAWEEDFS_ACCESS_KEY_ID='' docker compose --env-file .env.example --profile storage config --quiet; then
            echo 'Empty storage credentials unexpectedly accepted'; exit 1
          fi
          if SEAWEEDFS_SECRET_ACCESS_KEY='' docker compose --env-file .env.example --profile storage config --quiet; then
            echo 'Empty storage credentials unexpectedly accepted'; exit 1
          fi
      - name: Verify private S3 operations and persistent volume
        run: bash scripts/check-local-storage.sh --env-file .env.example -p hired-storage-ci
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: backend/.node-version
      - name: Install pinned backend dependencies
        working-directory: backend
        run: |
          npm install --global pnpm@12.14.0
          pnpm install --frozen-lockfile
          pnpm run generate
      - name: Verify private S3 SDK operations
        working-directory: backend
        run: pnpm run test:storage
      - name: Start bounded local scanner with current signatures
        run: |
          docker compose --env-file .env.example -p hired-storage-ci --profile scanner up -d --wait --wait-timeout 300 clamav
          # Freshclam may finish before clamd's socket exists and miss its reload notification.
          docker compose --env-file .env.example -p hired-storage-ci --profile scanner exec -T clamav clamdscan --reload
      - name: Wait for current signatures to be loaded by the scanner
        working-directory: backend
        run: node --import tsx scripts/wait-for-scanner.ts
      - name: Verify real upload, scan, retry and access lifecycle
        working-directory: backend
        run: pnpm run test:files:live
      - name: Verify real document attachment and private signed downloads
        working-directory: backend
        run: pnpm run test:documents:live
      - name: Show scanner diagnostics on failure
        if: failure()
        run: docker compose --env-file .env.example -p hired-storage-ci --profile scanner logs --no-color --tail 120 clamav
      - name: Remove disposable storage project
        if: always()
        run: docker compose --env-file .env.example -p hired-storage-ci --profile storage --profile scanner down --volumes
