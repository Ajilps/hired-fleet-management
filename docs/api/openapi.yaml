        - updatedAt
      oneOf:
        - properties:
            durationMinutes:
              type: "null"
            source:
              type: "null"
            heuristic:
              type: "null"
        - properties:
            durationMinutes:
              type: integer
              minimum: 1
            source:
              enum:
                - maps
                - admin_override
            heuristic:
              type: "null"
        - required:
            - heuristic
          properties:
            durationMinutes:
              type: integer
              minimum: 1
            source:
              const: distance_heuristic
            heuristic:
              $ref: "#/components/schemas/HeuristicEstimateBasis"
      description: Admin override takes precedence over the stored automatic estimate. Initially use
        distance_heuristic from optional supplied road kilometres and configured server speed; maps is
        reserved for later provider integration. This is duration, not live GPS. Missing inputs/policy
        have null duration/source. Preserve heuristic evidence only when it is the effective source.
      examples:
        - durationMinutes: 40
          source: distance_heuristic
          calculatedAt: 2026-10-10T09:00:00+05:30
          updatedAt: 2026-10-10T09:00:00+05:30
          heuristic:
            distanceKm: "20.00"
            averageSpeedKmh: "30.00"
            policyVersion: example-v1
        - durationMinutes: 41
          source: distance_heuristic
          calculatedAt: 2026-10-10T09:00:00+05:30
          updatedAt: 2026-10-10T09:00:00+05:30
          heuristic:
            distanceKm: "20.01"
            averageSpeedKmh: "30.00"
            policyVersion: example-v1
