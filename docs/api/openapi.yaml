    RouteDistanceKm:
      type: string
      pattern: ^(?!0\.00$)(?:0|[1-9][0-9]{0,7})\.[0-9]{2}$
      description: Optional manually supplied road distance for the initial heuristic. Omitted/null means
        unknown; no automatic geocoding or routing call. Not verified route distance.
    HeuristicEstimateBasis:
      type: object
      additionalProperties: false
      properties:
        distanceKm:
          type: string
          pattern: ^(?!0\.00$)(?:0|[1-9][0-9]{0,7})\.[0-9]{2}$
          description: Manually supplied road kilometres, positive fixed-two-decimal string; numeric(10,2).
        averageSpeedKmh:
          type: string
          pattern: ^(?!0\.00$)(?:0|[1-9][0-9]{0,3})\.[0-9]{2}$
          description: Applied server policy speed in km/h, positive fixed-two-decimal string; numeric(6,2).
        policyVersion:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
      required:
        - distanceKm
        - averageSpeedKmh
        - policyVersion
      description: Frozen evidence for a rough distance-based estimate. No traffic data; speed is
        server-selected, not client input.
    TripReportHeuristicBasis:
      type: object
      additionalProperties: false
      properties:
        distanceKm:
          type: string
          pattern: ^(?!0\.00$)(?:0|[1-9][0-9]{0,7})\.[0-9]{2}$
          description: Manually supplied road kilometres, positive fixed-two-decimal string; numeric(10,2).
        averageSpeedKmh:
          type: string
          pattern: ^(?!0\.00$)(?:0|[1-9][0-9]{0,3})\.[0-9]{2}$
          description: Applied server policy speed in km/h, positive fixed-two-decimal string; numeric(6,2).
        policyVersion:
          type: string
          minLength: 1
          maxLength: 50
          pattern: \S
      required:
        - distanceKm
        - averageSpeedKmh
        - policyVersion
      description: Frozen evidence for a rough distance-based estimate. No traffic data; speed is
        server-selected, not client input.
