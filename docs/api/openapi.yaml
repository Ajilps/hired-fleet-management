  /api/v1/trips/{tripId}/close:
    post:
      tags:
        - Trips
      summary: Close trip and atomically credit earnings
      description: >-
        **Access:** driver.


        Locks company then trip, authorizes current active driver, validates ongoing
        state/confirmation/code. One transaction closes trip, completes assignment, calculates payroll
        using closure-effective rate, inserts one wallet credit, updates balance and stores validated
        immutable report. Exact half-up driver share; company gets remainder; expenses do not affect
        split. Wrong code returns 422 INVALID_CLOSE_CODE, increments durable failure counter, creates
        no financial rows. Lockout returns 429 with Retry-After. Lost response: repeat same key/body;
        authenticate and replay before ETag checks. Already closed trip returns stored result only to
        active recorded payroll driver without revalidating used code or crediting again. Financial
        atomicity/uniqueness outlive key retention.
