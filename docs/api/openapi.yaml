          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tripId
        - driverId
        - amount
        - description
        - category
        - receiptAssetId
        - loggedAt
        - createdAt
        - updatedAt
    ExpenseList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Expense"
        totalExpenseAmount:
          $ref: "#/components/schemas/Money"
        expensesConfirmedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        expensesConfirmedByDriverId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
      required:
        - items
        - totalExpenseAmount
        - expensesConfirmedAt
        - expensesConfirmedByDriverId
      description: Complete trip expense list, not paginated, so confirmation covers every saved item.
        Read returns the aggregate trip ETag.
    ExpenseConfirmationRequest:
      type: object
      additionalProperties: false
      properties:
        hasNoExpenses:
          type: boolean
      required:
        - hasNoExpenses
      description: true is valid only for an empty saved list; false requires a nonempty list. If-Match
        must match the current aggregate trip ETag, covering assignment and expense changes.
    ExpenseConfirmation:
      type: object
      additionalProperties: false
      properties:
        tripId:
          type: string
          format: uuid
        expensesConfirmedAt:
          type: string
          format: date-time
        expensesConfirmedByDriverId:
          type: string
          format: uuid
        hasNoExpenses:
          type: boolean
        totalExpenseAmount:
          $ref: "#/components/schemas/Money"
      required:
        - tripId
        - expensesConfirmedAt
        - expensesConfirmedByDriverId
        - hasNoExpenses
        - totalExpenseAmount
    FileAsset:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        originalFilename:
          type: string
          maxLength: 255
        mimeType:
          type: string
          maxLength: 100
        sizeBytes:
          type: integer
          minimum: 1
        checksumSha256:
          anyOf:
            - type: string
              pattern: ^[a-f0-9]{64}$
            - type: "null"
        scanStatus:
          type: string
          enum:
            - pending
            - clean
            - rejected
        uploadedByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - originalFilename
        - mimeType
        - sizeBytes
        - checksumSha256
        - scanStatus
        - uploadedByUserId
        - createdAt
      description: Private metadata only, without storageKey or public URL. Attachment/download blocked
        until clean. Server derives and verifies MIME/size; upload policy limits are configurable.
    FileUploadRequest:
      type: object
      additionalProperties: false
      properties:
        file:
          type: string
          format: binary
        purpose:
          type: string
          enum:
            - driver_document
            - trip_selfie
            - expense_receipt
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
      required:
        - file
        - purpose
      description: "driver_document targets the authenticated pending/active driver (admin supplies
        driverId). trip_selfie/expense_receipt require tripId and current active driver assignment.
        Other context fields are rejected. Proposed allowlist: PDF/JPEG/PNG for documents/receipts;
        JPEG/PNG for selfies. Proposed maximum 10 MiB; server content-sniffs and quarantines pending
        scan."
    FileDownloadLink:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
      required:
        - url
        - expiresAt
      description: Short-lived private signed URL. Issuance checks current user and asset relationship.
        Existing URL lifetime is bounded by expiry; never cache or put it into immutable reports.
    DriverDocument:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        documentType:
          $ref: "#/components/schemas/DocumentType"
        fileAssetId:
          type: string
          format: uuid
        maskedDocumentNumber:
          anyOf:
            - type: string
            - type: "null"
        expiresOn:
          anyOf:
            - type: string
              format: date
            - type: "null"
        isCurrent:
          type: boolean
        uploadedAt:
          type: string
          format: date-time
      required:
        - id
        - driverId
        - documentType
        - fileAssetId
        - maskedDocumentNumber
        - expiresOn
        - isCurrent
        - uploadedAt
    AttachDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        documentType:
          $ref: "#/components/schemas/DocumentType"
        fileAssetId:
          type: string
          format: uuid
        documentNumber:
          type: string
          maxLength: 100
          writeOnly: true
        expiresOn:
          anyOf:
            - type: string
              format: date
            - type: "null"
      required:
        - documentType
        - fileAssetId
      description: Attaches first current document of a type. Raw document numbers never appear in
        ordinary responses.
    ReplaceDocumentRequest:
      type: object
      additionalProperties: false
      properties:
        fileAssetId:
          type: string
          format: uuid
        documentNumber:
          type: string
          maxLength: 100
          writeOnly: true
        expiresOn:
          anyOf:
            - type: string
              format: date
            - type: "null"
      required:
        - fileAssetId
      description: Atomic versioned replacement; old upload remains current until new clean file is
        attached. Retain document history.
    TripSelfie:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        fileAssetId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - tripId
        - fileAssetId
        - capturedAt
        - createdAt
    AttachSelfieRequest:
      type: object
      additionalProperties: false
      properties:
        fileAssetId:
          type: string
          format: uuid
        capturedAt:
          type: string
          format: date-time
      required:
        - fileAssetId
        - capturedAt
    Payroll:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        tripAmount:
          $ref: "#/components/schemas/Money"
        appliedDriverPercent:
          $ref: "#/components/schemas/Percent"
        appliedCompanyPercent:
          $ref: "#/components/schemas/Percent"
        driverShareAmount:
          $ref: "#/components/schemas/Money"
        companyShareAmount:
          $ref: "#/components/schemas/Money"
        payoutStatus:
          const: credited
        partnerPaymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        calculatedAt:
          type: string
          format: date-time
      required:
        - id
        - tripId
        - driverId
        - companyId
        - tripAmount
        - appliedDriverPercent
        - appliedCompanyPercent
        - driverShareAmount
        - companyShareAmount
        - payoutStatus
        - partnerPaymentStatus
        - calculatedAt
      description: Applied amounts/rates are immutable. Only live external partnerPaymentStatus may
        change. No cash-out/reversal endpoint exists in Phase 1.
    WalletCredit:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        payrollRecordId:
          type: string
          format: uuid
        transactionType:
          const: trip_credit
        amount:
          $ref: "#/components/schemas/Money"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - driverId
        - tripId
        - payrollRecordId
        - transactionType
        - amount
        - createdAt
    Wallet:
      type: object
      additionalProperties: false
      properties:
        driverId:
          type: string
          format: uuid
        balance:
          $ref: "#/components/schemas/Money"
        currency:
          const: INR
        updatedAt:
          type: string
          format: date-time
      required:
        - driverId
        - balance
        - currency
        - updatedAt
      description: Cached cumulative trip credits in MVP, not a withdrawable balance. Offline settlement
        has no debit/extra-credit action.
    WalletCreditList:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/WalletCredit"
        pageInfo:
          $ref: "#/components/schemas/PageInfo"
        totalCreditedAmount:
          $ref: "#/components/schemas/Money"
      required:
        - items
        - pageInfo
        - totalCreditedAmount
      description: Total covers all authorized filtered credits before pagination.
    CloseTripResult:
      type: object
      additionalProperties: false
      properties:
        trip:
          $ref: "#/components/schemas/Trip"
        payroll:
          $ref: "#/components/schemas/Payroll"
        walletCredit:
          $ref: "#/components/schemas/WalletCredit"
        reportId:
          type: string
          format: uuid
      required:
        - trip
        - payroll
        - walletCredit
        - reportId
      description: Returns persisted closure/payroll/credit/report identities, created in one transaction.
        Zero-price trip may have a zero credit. An authorized retry by the recorded payroll driver
        returns the same stored result.
    TripReportId:
      type: string
      format: uuid
    TripReportTimestamp:
      type: string
      format: date-time
    TripReportMoney:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$
      description: INR, exact two-decimal nonnegative amount; numeric(12,2).
    TripReportPercent:
      type: string
      pattern: ^(?:100\.00|(?:[0-9]|[1-9][0-9])\.[0-9]{2})$
    TripReportLocation:
      type: object
      additionalProperties: false
      properties:
        address:
          type: string
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
        - address
      dependentRequired:
        latitude:
          - longitude
        longitude:
          - latitude
    TripReportEstimate:
      type: object
      additionalProperties: false
      properties:
        durationMinutes:
          type:
            - integer
            - "null"
          minimum: 1
        source:
          enum:
            - maps
            - distance_heuristic
            - admin_override
            - null
        heuristic:
          anyOf:
            - $ref: "#/components/schemas/TripReportHeuristicBasis"
            - type: "null"
      required:
        - durationMinutes
        - source
      oneOf:
        - properties:
            durationMinutes:
              type: "null"
            source:
              type: "null"
            heuristic:
              type: "null"
        - properties:
            durationMinutes:
              type: integer
              minimum: 1
            source:
              enum:
                - maps
                - admin_override
            heuristic:
              type: "null"
        - required:
            - heuristic
          properties:
            durationMinutes:
              type: integer
              minimum: 1
            source:
              const: distance_heuristic
            heuristic:
              $ref: "#/components/schemas/TripReportHeuristicBasis"
      description: Effective route duration/source at closure. A distance_heuristic requires frozen
        distance/speed/policy evidence; other sources omit heuristic or use null.
    TripReportAssignment:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TripReportId"
        driverId:
          $ref: "#/components/schemas/TripReportId"
        assignedAt:
          $ref: "#/components/schemas/TripReportTimestamp"
        endedAt:
          $ref: "#/components/schemas/TripReportTimestamp"
        status:
          enum:
            - replaced
            - completed
            - cancelled
      required:
        - id
        - driverId
        - assignedAt
        - endedAt
        - status
    TripReportExpense:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TripReportId"
        driverId:
          $ref: "#/components/schemas/TripReportId"
        category:
          type: string
          minLength: 1
          maxLength: 50
        amount:
          allOf:
            - $ref: "#/components/schemas/TripReportMoney"
            - not:
                const: "0.00"
        description:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
        receiptAssetId:
          type:
            - string
            - "null"
          format: uuid
        loggedAt:
          $ref: "#/components/schemas/TripReportTimestamp"
      required:
        - id
        - driverId
        - category
        - amount
        - description
        - receiptAssetId
        - loggedAt
    TripReportTrip:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TripReportId"
        orderId:
          $ref: "#/components/schemas/TripReportId"
        companyId:
          $ref: "#/components/schemas/TripReportId"
        companyName:
          type: string
          minLength: 1
        driver:
          type: object
          additionalProperties: false
          properties:
            id:
              $ref: "#/components/schemas/TripReportId"
            name:
              type: string
              minLength: 1
          required:
            - id
            - name
        status:
          const: closed
        pickup:
          $ref: "#/components/schemas/TripReportLocation"
        drop:
          $ref: "#/components/schemas/TripReportLocation"
        contact:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              minLength: 1
            phone:
              type: string
              minLength: 1
              maxLength: 30
          required:
            - name
            - phone
        vehicleNotes:
          type:
            - string
            - "null"
        serviceNotes:
          type:
            - string
            - "null"
        scheduledPickupAt:
          $ref: "#/components/schemas/TripReportTimestamp"
        startedAt:
          $ref: "#/components/schemas/TripReportTimestamp"
        closedAt:
          $ref: "#/components/schemas/TripReportTimestamp"
        estimate:
          $ref: "#/components/schemas/TripReportEstimate"
        actualDurationSeconds:
          type: integer
          minimum: 0
        expensesConfirmedAt:
          $ref: "#/components/schemas/TripReportTimestamp"
        expensesConfirmedByDriverId:
          $ref: "#/components/schemas/TripReportId"
        assignments:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TripReportAssignment"
      required:
        - id
        - orderId
        - companyId
        - companyName
        - driver
        - status
        - pickup
        - drop
        - contact
        - vehicleNotes
        - serviceNotes
        - scheduledPickupAt
        - startedAt
        - closedAt
        - estimate
        - actualDurationSeconds
        - expensesConfirmedAt
        - expensesConfirmedByDriverId
        - assignments
    TripReportPayroll:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TripReportId"
        tripAmount:
          $ref: "#/components/schemas/TripReportMoney"
        appliedDriverPercent:
          $ref: "#/components/schemas/TripReportPercent"
        appliedCompanyPercent:
          $ref: "#/components/schemas/TripReportPercent"
        driverShareAmount:
          $ref: "#/components/schemas/TripReportMoney"
        companyShareAmount:
          $ref: "#/components/schemas/TripReportMoney"
        totalAmount:
          $ref: "#/components/schemas/TripReportMoney"
        paymentStatusAtClosure:
          enum:
            - unpaid
            - settled
            - disputed
        payoutStatusAtClosure:
          const: credited
      required:
        - id
        - tripAmount
        - appliedDriverPercent
        - appliedCompanyPercent
        - driverShareAmount
        - companyShareAmount
        - totalAmount
        - paymentStatusAtClosure
        - payoutStatusAtClosure
    TripReportWalletCredit:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: "#/components/schemas/TripReportId"
        amount:
          $ref: "#/components/schemas/TripReportMoney"
      required:
        - id
        - amount
    TripReportSnapshot:
      title: HireD immutable trip report snapshot v1
      description: Proposed closure contract. Services must also reconcile relational IDs, money totals,
        timestamps and ownership; JSON Schema alone does not enforce those invariants.
      type: object
      additionalProperties: false
      properties:
        reportId:
          $ref: "#/components/schemas/TripReportId"
        snapshotVersion:
