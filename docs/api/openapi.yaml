          schema:
            type: string
            format: date-time
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Proposed short-lived access token issued by login/refresh. Token
        encoding/issuer/lifetimes configured by backend. Each request also checks session, isActive,
        role and resource ownership.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size; immutable report detail and complete expense lists are unpaginated.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor bound to caller, filters and sort. Changing filters requires a new first page.
      schema:
        type: string
    CompanyIds:
      name: companyIds
      in: query
      required: false
      description: "Admin-only optional repeated UUID query: companyIds=id1&companyIds=id2. Omission
        selects all. Drivers are global, never company-owned."
      schema:
        type: array
        items:
          type: string
          format: uuid
        minItems: 1
        uniqueItems: true
      style: form
      explode: true
    CompanyId:
      name: companyId
      in: query
      required: false
      description: Admin filter only. Partner scope is derived from its single company membership; partner
        must omit this filter.
      schema:
        type: string
        format: uuid
    DriverId:
      name: driverId
      in: query
      required: false
      description: Admin-only driver filter.
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: true
      description: Inclusive UTC instant. to must be greater than from.
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      required: true
      description: Exclusive UTC instant. Convert calendar dates from Asia/Kolkata before querying.
      schema:
        type: string
        format: date-time
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique command identity per actor/method/path. Same key and normalized body replays the
        result; different body or original If-Match conflicts. Authenticate/authorize every replay.
        Internal PostgreSQL command foundation retains safe results for 25 hours; endpoints consume
        it as implemented. Permanent domain uniqueness is still required for
        closure/acceptance/publication. Replays are resolved before stale preconditions; same failed
        OTP attempt is not counted twice.
      schema:
        type: string
        minLength: 1
        maxLength: 100
        pattern: ^[A-Za-z0-9:_-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Opaque strong ETag from latest resource read; no wildcard. Trips use an aggregate tag
        covering assignment and expense mutations. Replay lookup precedes this precondition. A stale
        new command gets 412; a missing header gets 428.
      schema:
        type: string
        minLength: 1
  headers:
    RequestId:
      description: Correlation identity; also included in error payload.
      schema:
        type: string
        format: uuid
    ETag:
      description: Strong opaque aggregate version, quoted. Refresh before new writes.
      schema:
        type: string
        examples:
          - '"trip-version-7"'
    CacheControl:
      description: Sensitive responses must not be cached.
      schema:
        type: string
        const: no-store
    RetryAfter:
      description: Seconds until retry permitted; supplied for throttling/lockout.
      schema:
        type: integer
        minimum: 0
  responses:
    BadRequest:
      description: Malformed request or unsupported filter.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: BAD_REQUEST
              message: The query or request format is invalid.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    Unauthorized:
      description: Missing, expired or revoked credentials.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: UNAUTHORIZED
              message: Sign in with an active session.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    Forbidden:
      description: Role or operational account status forbids this action.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: FORBIDDEN
              message: This account cannot perform the operation.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    NotFound:
      description: Resource absent or outside caller scope; do not reveal existence.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: NOT_FOUND
              message: The requested resource is unavailable.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    Conflict:
      description: Lifecycle/idempotency/version/ownership conflict; inspect error.code.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: STATE_CONFLICT
              message: The resource state does not permit this operation.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    PreconditionFailed:
      description: If-Match is stale. Refresh authoritative resource; reapply intent with a new key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: STALE_RESOURCE
              message: Refresh the resource before applying a new command.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    PayloadTooLarge:
      description: File exceeds configured upload limit.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: UPLOAD_TOO_LARGE
              message: The file exceeds the configured size limit.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    UnsupportedMediaType:
      description: Unsupported upload content type.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: UNSUPPORTED_FILE_TYPE
              message: The file content type is not supported.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    ValidationError:
      description: Well-formed request fails field/domain validation.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: VALIDATION_FAILED
              message: One or more fields are invalid.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    PreconditionRequired:
      description: Required If-Match header is missing.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: PRECONDITION_REQUIRED
              message: Supply If-Match from the latest resource read.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    TooManyRequests:
      description: Throttled or close-code lockout. Respect Retry-After; no closure/credit created.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: RATE_LIMITED
              message: Retry after the server-provided delay.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: 60
    ServiceUnavailable:
      description: Temporary dependency failure. Do not infer failure of an interrupted command; retry
        with the same key.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Temporarily unavailable; retry the same command identity.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
    UnexpectedError:
      description: Unexpected error; financial writes roll back atomically. An interrupted response does
        not prove rollback.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
          example:
            error:
              code: INTERNAL_ERROR
              message: An unexpected error occurred.
              requestId: 22222222-2222-4222-8222-222222222222
              details: []
              retryAfterSeconds: null
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
  schemas:
    Money:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,9})\.[0-9]{2}$
      description: Exact nonnegative INR decimal, numeric(12,2). Never use floating point for calculation.
      examples:
        - "10000.00"
    StatementMoney:
      type: string
      pattern: ^(?:0|[1-9][0-9]{0,11})\.[0-9]{2}$
      description: Exact nonnegative INR decimal, numeric(14,2).
      examples:
        - "10000.00"
    PositiveMoney:
      allOf:
        - $ref: "#/components/schemas/Money"
        - not:
            const: "0.00"
    Percent:
      type: string
      pattern: ^(?:100\.00|(?:[0-9]|[1-9][0-9])\.[0-9]{2})$
      examples:
        - "30.00"
    PositivePercent:
      allOf:
        - $ref: "#/components/schemas/Percent"
        - not:
            const: "0.00"
    UserRole:
      type: string
      enum:
        - admin
        - partner
        - driver
    DriverStatus:
      type: string
      enum:
        - pending
        - active
        - inactive
        - suspended
    OrderStatus:
      type: string
      enum:
        - received
        - accepted
        - rejected
    TripStatus:
      type: string
      enum:
        - unassigned
        - assigned
        - ongoing
        - closed
    DocumentType:
      type: string
      enum:
        - driving_license
        - aadhar
        - pan
        - pcc
      description: The stored/API compatibility spelling is aadhar; UI may display Aadhaar.
    StatementStatus:
      type: string
      enum:
        - draft
        - pending_verification
        - verified
        - published
        - void
      description: void is reserved; no MVP mutation can enter it.
    PaymentStatus:
      type: string
      enum:
        - unpaid
        - settled
        - disputed
    FieldError:
      type: object
      additionalProperties: false
      properties:
        field:
          type: string
        message:
          type: string
        code:
          type: string
      required:
        - field
        - message
        - code
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            code:
              type: string
              examples:
                - STATE_CONFLICT
            message:
              type: string
            requestId:
              type: string
              format: uuid
            details:
              type: array
              items:
                $ref: "#/components/schemas/FieldError"
            retryAfterSeconds:
              anyOf:
                - type: integer
                  minimum: 0
                - type: "null"
          required:
            - code
            - message
            - requestId
            - details
            - retryAfterSeconds
      required:
        - error
    PageInfo:
      type: object
      additionalProperties: false
      properties:
        nextCursor:
          anyOf:
            - type: string
            - type: "null"
        hasMore:
          type: boolean
        totalCount:
          type: integer
          minimum: 0
      required:
        - nextCursor
        - hasMore
        - totalCount
      description: Opaque cursor over a stable timestamp/id ordering. totalCount covers all authorized
        filtered rows, not only this page.
    User:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
          maxLength: 255
        role:
          $ref: "#/components/schemas/UserRole"
        fullName:
          type: string
          minLength: 1
          maxLength: 150
          pattern: \S
        phone:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 30
            - type: "null"
        isActive:
          type: boolean
        passwordChangeRequired:
          type: boolean
          description: Business workflows return 403 PASSWORD_CHANGE_REQUIRED until a verified change and fresh sign-in.
        companyId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        driverId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - role
        - fullName
        - phone
        - isActive
        - passwordChangeRequired
        - companyId
        - driverId
        - createdAt
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        newPassword:
          type: string
          minLength: 15
          maxLength: 128
          writeOnly: true
      required: [currentPassword, newPassword]
      description: New password must differ from currentPassword. Preserve spaces and bytes; no composition rule.
    LoginRequest:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        deviceName:
          type: string
          maxLength: 150
        transport:
          type: string
          enum: [browser, token]
          default: token
      required:
        - email
        - password
    RefreshRequest:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            transport:
              const: browser
          required: [transport]
        - type: object
          additionalProperties: false
          properties:
            transport:
              const: token
            refreshToken:
              type: string
              minLength: 1
              maxLength: 100
              writeOnly: true
          required: [refreshToken]
    AuthSessionTokens:
      oneOf:
        - $ref: "#/components/schemas/SessionTokens"
        - $ref: "#/components/schemas/BrowserSessionTokens"
    BrowserSessionTokens:
      type: object
      additionalProperties: false
      description: Access-only JSON. Refresh token is an HttpOnly SameSite=Lax host-only cookie;
        production uses Secure __Host-hired_refresh with Path=/, local HTTP uses hired_refresh with
        Path=/api/v1/auth-sessions. Browser/API deployment must be same-site and origins explicitly
        allowlisted. Access tokens stay in memory. Current implementation supports admins and scoped partners, including mandatory first-login password changes for provisioned accounts; driver identity now derives from its current profile; pending drivers remain ineligible for operational work.
      properties:
        transport:
          const: browser
        accessToken:
          type: string
        tokenType:
          const: Bearer
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
      required: [transport, accessToken, tokenType, accessTokenExpiresAt, refreshTokenExpiresAt, sessionId, user]
    SessionTokens:
      type: object
      additionalProperties: false
      properties:
        transport:
          const: token
        accessToken:
          type: string
        tokenType:
          const: Bearer
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
        sessionId:
          type: string
          format: uuid
        user:
          $ref: "#/components/schemas/User"
      required:
        - accessToken
        - tokenType
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - sessionId
        - user
      description: JSON token transport for native clients. Refresh tokens are opaque, rotated on
        every use, hashed at rest and excluded from logs. Token lifetimes and password policy are
        deployment configuration.
    AuthSession:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        deviceName:
          anyOf:
            - type: string
            - type: "null"
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
