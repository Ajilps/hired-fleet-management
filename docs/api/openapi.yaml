# HireD Phase 1 proposed API contract. Edit this source; openapi.json is generated.
openapi: 3.1.0
info:
  title: HireD Phase 1 API
  version: 0.2.0-draft
  summary: Proposed contracts for the admin portal, business partner portal and driver app.
  description: Design contract, not a deployed backend. Based on BASAP workflows, DBML and immutable
    trip-report JSON Schema. All routes include /api/v1. Amounts are exact INR decimal strings;
    timestamps include timezone offsets. Bearer authentication does not by itself enforce roles or
    ownership; implement every operation x-roles and resource-scope rule. x-policy-decisions marks
    provisional choices documented in README.md. No GPS, driver accept/reject, in-app
    collection/withdrawal, financial adjustment or formal document verification endpoints.
  contact:
    name: HireD BASAP project
    url: https://github.com/Buildathon-HireD-Brototype-2026/BASAP
servers:
  - url: http://localhost:3000
    description: Proposed local backend; documentation server runs separately on 8080.
security:
  - bearerAuth: []
tags:
  - name: Authentication
    description: Login, rotating refresh sessions and logout.
  - name: Accounts
    description: Admin/user accounts and current identity.
  - name: Companies
    description: Company membership and closure-effective split history.
  - name: Drivers
    description: Operational onboarding, profile and availability.
  - name: Files
    description: Private, quarantined uploads and authorized short-lived downloads.
  - name: Documents
    description: Initial identity uploads and P2 versioned replacements.
  - name: Orders
    description: Intake, decision and pre-acceptance estimates.
  - name: Trips
    description: Dispatch, execution, partner-only code reveal and atomic closure.
  - name: Expenses
    description: Current-driver saved list and explicit completion confirmation.
  - name: Trip reports
    description: Immutable version-1 closure snapshots.
  - name: Earnings
    description: Own cumulative trip credits; payments handled offline.
  - name: Payroll
    description: Immutable calculated splits and live external settlement status.
  - name: Statements
    description: Monthly draft, two distinct approvals and publication.
  - name: Admin reports
    description: Seven required reports with consistent filters and whole-range totals.
  - name: Operations
    description: Sanitized email delivery and audit metadata.
paths:
  /api/v1/auth-sessions/login:
    post:
      tags:
        - Authentication
      summary: Sign in and create a session
      description: >-
        **Access:** public.


        Checks user isActive. Pending drivers can access only permitted onboarding operations. Wrong
        credentials use generic 401; rate-limit login. Password policy and lifetimes are configured.
        The current backend supports admins and partners with one stored company membership.
        Provisioned partners receive passwordChangeRequired=true and cannot access company workflows
        until POST /users/me/password succeeds and they sign in again. Driver integration remains planned. Browser clients send transport=browser,
        an allowlisted Origin and X-CSRF-Guard: 1; their refresh credential is set only in an
        HttpOnly cookie. Native clients retain the JSON token transport (the default).
      operationId: login
      x-roles:
        - public
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: driver@example.test
              password: example-only-password
              deviceName: Android driver app
  /api/v1/auth-sessions/refresh:
    post:
      tags:
        - Authentication
      summary: Rotate a refresh token
      description: >-
        **Access:** public.


        Opaque refresh token authenticates this operation; bearer not required. Rotate atomically
        and revoke session on detected reuse. Reject revoked/expired sessions and inactive users.
        Browser mode sends only {transport: browser}, the refresh cookie, an allowlisted Origin and
        X-CSRF-Guard: 1. Native mode sends refreshToken in JSON and cannot rotate browser sessions.
        Refresh expiry is absolute; a lost response is not automatically replayed. Consumed token
        reuse revokes the session, including previously issued access credentials.
      operationId: refreshSession
      x-roles:
        - public
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionTokens"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
  /api/v1/auth-sessions/logout:
    post:
      tags:
        - Authentication
      summary: Revoke the current session
      description: >-
        **Access:** admin, partner, driver.


        Revokes current refresh session and access token use for that session. A revoked credential
        returns 401 on retry.
        Browser callers also send {transport: browser}, an allowlisted Origin and X-CSRF-Guard: 1;
        the refresh cookie is cleared on success or an expired/revoked bearer response.
      operationId: logout
      requestBody:
        required: false
        description: Browser sessions require this body plus an allowlisted Origin and X-CSRF-Guard header; native sessions omit the body.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [transport]
              properties:
                transport:
                  type: string
                  const: browser
      x-roles:
        - admin
        - partner
        - driver
      x-priority: P0
      responses:
        "204":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /api/v1/auth-sessions:
    get:
      tags:
        - Authentication
      summary: List own active sessions
      description: "**Access:** admin, partner, driver."
      operationId: listOwnSessions
      x-roles:
        - admin
        - partner
        - driver
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
  /api/v1/auth-sessions/{sessionId}:
    delete:
      tags:
        - Authentication
      summary: Revoke an owned session
      description: |-
        **Access:** admin, partner, driver.

        Only session owner; revocation affects refresh and current-session access.
      operationId: revokeOwnSession
      x-roles:
        - admin
        - partner
        - driver
      x-priority: P0
      responses:
        "204":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - name: sessionId
          in: path
          required: true
          description: Resource identity.
          schema:
            type: string
            format: uuid
  /api/v1/users/me:
    get:
      tags:
        - Accounts
      summary: Get the signed-in user
      description: "**Access:** admin, partner, driver."
      operationId: getCurrentUser
      x-roles:
        - admin
        - partner
        - driver
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /api/v1/users/me/password:
    post:
      tags:
        - Accounts
      summary: Change own password and revoke all sessions
      description: >-
        **Access:** admin, partner. Available to password-change-required sessions.
        Verify the current password and atomically replace its hash, clear passwordChangeRequired,
        revoke every session (including this one) and append a safe audit event. Browser sessions
        require an allowlisted Origin and X-CSRF-Guard: 1 based on the stored session transport;
        clear their refresh cookie on success. Returns no credentials; sign in again. No idempotency
        header or automatic retry: after an uncertain result, try signing in with the new password.
        Password attempts use durable account/IP throttles. Driver integration remains planned.
      operationId: changeOwnPassword
      x-roles:
        - admin
        - partner
      x-priority: P0
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed and every existing session revoked. Sign in again.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControl"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /api/v1/driver-applications:
    post:
      tags: [Drivers]
      summary: Public driver applications are disabled
      description: >-
        Owner-selected admin-only onboarding. Always returns 403 ADMIN_ONBOARDING_REQUIRED
        without creating an account, profile, audit or replay. Use authenticated POST /api/v1/drivers.
      deprecated: true
      operationId: submitDriverApplication
      x-roles: [public]
      x-priority: P0
      security: []
      responses:
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/UnexpectedError"
  /api/v1/users:
    get:
      tags:
        - Accounts
      summary: List user accounts
      description: >-
        **Access:** admin with completed password setup. Safe management DTOs include enabled and
        disabled accounts. Current role/identity metadata does not grant unsupported driver or
        missing partner auth scope. Directory order is descending creation timestamp/UUID, with
        full PostgreSQL microsecond precision in signed actor/role-bound cursors and consistent totals.
      operationId: listUsers
      x-roles:
        - admin
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: role
          in: query
          required: false
          description: ""
          schema:
            $ref: "#/components/schemas/UserRole"
    post:
      tags:
        - Accounts
      summary: Create another admin account
      description: >-
        **Access:** admin.


        All admins have the same role. Bootstrap of the first admin is an operational task, not a
        public endpoint. Creates an enabled admin with mandatory first-login password change;
        only safe identity/audit/replay payloads are retained. Email is normalized and globally unique;
        conflicts never overwrite an existing account. Creation and audit/replay commit together.
      operationId: createAdminUser
      x-roles:
        - admin
      x-priority: P0
      responses:
        "201":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
  /api/v1/users/{userId}:
    get:
      tags:
        - Accounts
      summary: Get a user account
      description: "**Access:** admin with completed password setup. Safe management identity; no credential columns."
      operationId: getUser
      x-roles:
        - admin
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - name: userId
          in: path
          required: true
          description: Resource identity.
          schema:
            type: string
            format: uuid
  /api/v1/users/{userId}/status:
    patch:
      tags:
        - Accounts
      summary: Enable or disable an account
      description: >-
        **Access:** admin.


        Disabling revokes sessions and blocks operational writes. Audit actor and reason. Prevent
        disabling the final enabled admin who completed first-login password setup (owner-selected
        safeguard); an enabled restricted admin does not count. Serializes status changes before
        authoritative actor/session checks to prevent concurrent self/cross-admin lockout.
        May disable self when another usable admin remains; that revokes the current session too,
        so the old session cannot replay afterward. Re-enabling never restores revoked sessions.
        New intents require a reason, including no-op changes. Replay returns the recorded safe
        outcome after current authorization, before current-state eligibility. Does not change driver
        operational status, memberships, company state or history. The status serialization wait
        is bounded; contention returns 503 ACCOUNT_CHANGE_RETRY_REQUIRED with Retry-After.
      operationId: setUserStatus
      x-roles:
        - admin
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - name: userId
          in: path
          required: true
          description: Resource identity.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusRequest"
  /api/v1/companies:
    get:
      tags:
        - Companies
      summary: List companies
      description: "**Access:** admin."
      operationId: listCompanies
      x-roles:
        - admin
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
    post:
      tags:
        - Companies
      summary: Create company and initial payout split
      description: >-
        **Access:** admin.


        Company and initial rate commit together. Validate split sums to 100.00; use exact decimals.
        Company ownership never belongs to a driver.
      operationId: createCompany
      x-roles:
        - admin
      x-priority: P0
      responses:
        "201":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
  /api/v1/companies/{companyId}:
    get:
      tags:
        - Companies
      summary: Get a company
      description: |-
        **Access:** admin, partner.

        Partner can access only its membership company.
      operationId: getCompany
      x-roles:
        - admin
        - partner
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - name: companyId
          in: path
          required: true
          description: Resource identity.
          schema:
            type: string
            format: uuid
    patch:
      tags:
        - Companies
      summary: Update company details
      description: |-
        **Access:** admin.

        Deactivation blocks new intake, not historical access or frozen finances. Audit changes.
      operationId: updateCompany
      x-roles:
        - admin
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - name: companyId
          in: path
          required: true
          description: Resource identity.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyPatch"
      x-policy-decisions:
        - company-deactivation-policy
  /api/v1/companies/{companyId}/payout-rates:
    get:
      tags:
        - Companies
      summary: Read payout split history
      description: "**Access:** admin."
      operationId: listCompanyRates
      x-roles:
        - admin
      x-priority: P0
      responses:
        "200":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRateList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/UnexpectedError"
      parameters:
        - name: companyId
          in: path
          required: true
          description: Resource identity.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
    post:
      tags:
        - Companies
      summary: Begin a new payout split
      description: >-
        **Access:** admin.


        Locks company row as closure does. Validate both positive percentages sum to 100.00 and
        intervals do not overlap. Database effective time after lock acquisition; existing payroll/statements remain frozen. The current implementation is admin-only.
      operationId: createCompanyRate
      x-roles:
        - admin
      x-priority: P0
      responses:
        "201":
          description: Successful result.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutRate"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
