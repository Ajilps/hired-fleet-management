        - billingTimezone
        - status
        - contentVersion
        - totalTripAmount
        - totalDriverShare
        - totalCompanyShare
        - createdByUserId
        - createdAt
        - submittedAt
        - verifiedAt
        - publishedAt
        - publishedByUserId
    Statement:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        periodStart:
          type: string
          format: date
        periodEnd:
          type: string
          format: date
        billingTimezone:
          const: Asia/Kolkata
        status:
          $ref: "#/components/schemas/StatementStatus"
        contentVersion:
          type: integer
          minimum: 1
        totalTripAmount:
          $ref: "#/components/schemas/StatementMoney"
        totalDriverShare:
          $ref: "#/components/schemas/StatementMoney"
        totalCompanyShare:
          $ref: "#/components/schemas/StatementMoney"
        createdByUserId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        submittedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        verifiedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        publishedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        publishedByUserId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        items:
          type: array
          items:
            $ref: "#/components/schemas/StatementItem"
        approvals:
          type: array
          items:
            $ref: "#/components/schemas/StatementApproval"
          maxItems: 2
      required:
        - id
        - companyId
        - periodStart
        - periodEnd
        - billingTimezone
        - status
        - contentVersion
        - totalTripAmount
        - totalDriverShare
        - totalCompanyShare
        - createdByUserId
        - createdAt
        - submittedAt
        - verifiedAt
        - publishedAt
        - publishedByUserId
        - items
        - approvals
      description: Amounts/rates copied from closed-trip payroll. Content freezes at submission. Creator
        plus one distinct admin must explicitly approve the same version; creating is not approval.
        Partner visibility requires published under the working policy.
    GenerateStatementRequest:
      type: object
      additionalProperties: false
      properties:
        companyId:
          type: string
          format: uuid
        billingMonth:
          type: string
          pattern: ^\d{4}-(?:0[1-9]|1[0-2])$
      required:
        - companyId
        - billingMonth
      description: Completed calendar months only, actual trip closure in Asia/Kolkata, period end
        exclusive. Duplicate company/month returns conflict with existing statementId.
    StatementVersionRequest:
      type: object
      additionalProperties: false
      properties:
        contentVersion:
          type: integer
          minimum: 1
      required:
        - contentVersion
      description: Must match current frozen/reviewed contentVersion. Stale version yields 409
        CONTENT_VERSION_CONFLICT.
    PaymentStatusRequest:
      type: object
      additionalProperties: false
      properties:
        partnerPaymentStatus:
          $ref: "#/components/schemas/PaymentStatus"
        reason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: \S
      required:
        - partnerPaymentStatus
        - reason
      description: Records external settlement/dispute status in existing payroll; audit reason. No
        payment processing, wallet debit or recalculation. Detailed settlement reference/date/amount
        fields are outside current DBML.
    Notification:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        companyId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        orderId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        statementId:
          anyOf:
            - type: string
              format: uuid
            - type: "null"
        eventType:
          type: string
          enum:
            - order_accepted
            - order_rejected
            - statement_published
        channel:
          const: email
        status:
          type: string
          enum:
            - pending
            - processing
