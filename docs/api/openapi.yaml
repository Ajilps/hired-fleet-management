        totalExpenseAmount:
          $ref: "#/components/schemas/TripReportMoney"
        payroll:
          $ref: "#/components/schemas/TripReportPayroll"
        walletCredit:
          $ref: "#/components/schemas/TripReportWalletCredit"
      required:
