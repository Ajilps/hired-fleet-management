# Local development scanner. TCP is confined to its API-only bridge and host loopback.
Foreground yes
User clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogFile /var/log/clamav/clamd.log
LogFileMaxSize 1M
LogTime yes
LogClean no
MaxThreads 4
MaxQueue 8
ReadTimeout 15
CommandReadTimeout 5
StreamMaxLength 6M
MaxFileSize 6M
MaxScanSize 30M
MaxRecursion 10
MaxFiles 1000
# Exceeded parser/expansion bounds and encrypted content must not silently be clean.
AlertExceedsMax yes
AlertEncrypted yes
ScanArchive yes
ScanPDF yes
SelfCheck 60
